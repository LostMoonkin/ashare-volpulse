appId: com.asharemonitor.app
productName: A股能量看板
directories:
  output: release
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
npmRebuild: false
win:
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: a-share-monitor-${version}-win-${arch}-portable.${ext}
mac:
  category: public.app-category.finance
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: a-share-monitor-${version}-mac-${arch}.${ext}
dmg:
  artifactName: a-share-monitor-${version}-mac-${arch}.${ext}
